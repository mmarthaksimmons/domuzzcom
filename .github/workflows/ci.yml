name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Type-check and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # Prisma's config reads DATABASE_URL at generate time; no real database
      # connection is opened during lint/build.
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci?schema=public"
      NEXT_TELEMETRY_DISABLED: "1"
      DISABLE_RATE_LIMIT: "true"

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        # Non-blocking for now: the existing code base still has ~42 lint
        # errors (mostly @typescript-eslint/no-explicit-any). Remove
        # `continue-on-error` once those are cleaned up so lint becomes a gate.
        continue-on-error: true
        run: npm run lint

      - name: Build
        run: npm run build
