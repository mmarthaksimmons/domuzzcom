name: Feature request
description: Suggest an idea or improvement
labels: ["enhancement", "needs triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the use case rather than only the proposed implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Which area does this touch?
      multiple: true
      options:
        - Property comparison (/compare)
        - CMA report (/cma)
        - FSBO calculator (/fsbo)
        - Data sources / scraping
        - AI analysis
        - PDF export / print view
        - Developer experience / tooling
        - Other
    validations:
      required: false
  - type: checkboxes
    id: contributions
    attributes:
      label: Contribution
      options:
        - label: I would be willing to open a PR for this
